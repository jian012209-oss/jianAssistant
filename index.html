  },
  'clear-chats': () => confirmSheet({
    title: 'Delete all chats?', body: 'Every conversation on this device will be removed. Saved answers stay.', confirm: 'Delete all chats',
    onConfirm: () => { if (S.gen) stopGeneration(); S.convs = []; S.currentId = null; saveConvs(); renderYou(); toast('All chats deleted.'); },
  }),
  'clear-models': () => confirmSheet({
    title: 'Delete all models?', body: `This frees ${fmtBytes([...S.downloaded.values()].reduce((a, b) => a + (b.size || 0), 0))}. You’ll need internet to download them again.`, confirm: 'Delete all models',
    onConfirm: async () => {
      if (PREVIEW) return;
      try {
        if (S.gen) stopGeneration();
        await Engine.unload();
        await Engine.ensureLib();
        await Engine.mm.clear();
        S.customModels = S.customModels.filter((c) => !c.imported);
        store.set('custom', S.customModels);
        S.activeKey = null; store.del('activeKey');
        S.engine = 'idle'; S.engineInfo = null;
        await refreshDownloaded();
        S.device = await detectDevice();
        toast('All models deleted.');
      } catch (e) { toast(`Couldn’t delete: ${String(e?.message || e).slice(0, 80)}`, 'risk'); }
      renderYou(); renderChrome();
    },
  }),
  'retry-load': () => {
    closeSheet();
    store.del('gpuFallback');
    const key = S.activeKey && S.downloaded.has(S.activeKey) ? S.activeKey : [...S.downloaded.keys()][0];
    if (key) activateModel(key);
  },
  'reset-gpu': () => { store.del('gpuFallback'); toast('GPU boost will be tried next time a model loads.'); renderYou(); },
  'install': async () => {
    const p = S.installPrompt;
    if (!p) return;
    S.installPrompt = null;
    try { p.prompt(); await p.userChoice; } catch { /* ignore */ }
    renderYou();
  },
};

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  const act = e.target.closest('[data-action]');
  if (act && act.dataset.action && actions[act.dataset.action]) {
    if (act.tagName === 'A') e.preventDefault();
    actions[act.dataset.action](act, e);
  }
  if (nav) {
    if (!act || act.dataset.action === 'close-sheet') closeSheet();
    go(nav.dataset.nav);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#sheet-layer').hidden && sheetHandlers.dismissable !== false) closeSheet();
});
document.addEventListener('click', (e) => {
  const sum = e.target.closest('details.think > summary');
  const id = sum?.closest('.msg')?.dataset.id;
  if (id) userToggled.add(id);
}, true);
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'model-search') { S.query = t.value; renderModels(); }
  else if (t.id === 'history-search') { S.historyQuery = t.value; renderHistory(); }
  else if (t.id === 'prompt') autosize();
  else if (t.id === 'pf-name' || t.id === 'pf-about') {
    S.profile[t.id === 'pf-name' ? 'name' : 'about'] = t.value;
    store.set('profile', S.profile);
    if (t.id === 'pf-name') {
      const av = document.querySelector('#you-root .avatar');
      if (av) av.textContent = (t.value || 'You').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
    }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'model-sort') { S.sort = t.value; renderModels(); }
  else if (t.id === 'pf-use') { S.settings.useProfile = t.checked; saveSettings(); }
  else if (t.id === 'set-gpu') {
    S.settings.gpu = t.checked;
    saveSettings();
    store.del('gpuFallback');
    if (S.engine === 'ready' && S.activeKey) { toast('Reloading the model…'); Engine.unload().then(() => activateModel(S.activeKey, { quiet: true })); }
  } else if (t.id === 'sheet-think') { S.settings.think = t.checked; saveSettings(); renderComposer(); }
  else if (t.id === 'image-input') onImagePicked(t.files?.[0]);
  else if (t.id === 'gguf-input') onGgufPicked(t.files);
});

const coarse = matchMedia('(pointer: coarse)').matches;
function autosize() {
  const ta = $('#prompt');
  ta.style.height = 'auto';
  ta.style.height = Math.min(168, ta.scrollHeight) + 'px';
}
$('#prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); if (!S.gen) sendPrompt(); }
});
$('#composer').addEventListener('submit', (e) => {
  e.preventDefault();
  if (S.gen) stopGeneration();
  else sendPrompt();
});

window.addEventListener('online', () => renderChrome());
window.addEventListener('offline', () => renderChrome());
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  S.installPrompt = e;
  if (S.screen === 'you') renderYou();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ------------------------------------------------------------------ */
/* Service worker (published site only)                                */
/* ------------------------------------------------------------------ */
function busy() { return !!(S.dl || S.gen || S.engine === 'loading'); }
function setupServiceWorker() {
  if (PREVIEW || TEST_ENGINE || !('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('./sw.js').then(() => {
    if (window.crossOriginIsolated) return;
    // The worker adds the headers that unlock multi-core speed. Reload once to pick them up.
    const tried = store.get('coiTried', '');
    if (tried === navigator.userAgent) return;
    const reloadOnce = () => {
      if (busy()) return;
      store.set('coiTried', navigator.userAgent);
      location.reload();
    };
    if (navigator.serviceWorker.controller) reloadOnce();
    else navigator.serviceWorker.addEventListener('controllerchange', reloadOnce, { once: true });
  }).catch(() => { /* offline support unavailable */ });
}

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */
async function boot() {
  applyTheme();
  if (PREVIEW) {
    $('#preview-banner').hidden = false;
    S.activeKey = EXAMPLE_CHAT[1].key;
  }
  const start = (location.hash || '').slice(1);
  go(SCREENS.includes(start) ? start : 'chat', { push: false });
  S.device = await detectDevice();
  if (S.screen === 'models') renderModels();
  if (PREVIEW) { renderChrome(); return; }
  setupServiceWorker();
  try {
    await Engine.ensureLib();
    await refreshDownloaded();
    S.engine = 'idle';
  } catch {
    S.engine = 'unavailable';
  }
  if (S.activeKey && !S.downloaded.has(S.activeKey)) S.activeKey = [...S.downloaded.keys()][0] || null;
  renderChrome();
  if (S.screen === 'chat') renderThread();
  if (S.screen === 'models') renderModels();
  if (S.activeKey) activateModel(S.activeKey, { quiet: true });
}

if (TEST_ENGINE) window.__APP__ = { S, Engine, go, sendPrompt, activateModel, startDownload, md, splitThink };
boot();

</script>
</body>
</html>
